spring:
  application:
      name: disponibilidad-service
  jpa: 
    open-in-view: false
 
server:
  port: 8082

eureka: 
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /swagger-ui.html