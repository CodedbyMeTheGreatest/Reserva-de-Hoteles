spring:
  application:
    name: habitaciones-service
  datasource:
    url: jdbc:mysql://localhost:3306/db_hoteleria_habitaciones
    username: root
    password:
    driver-class-name: com.mysql.jdbc.Driver
 
  jpa: 
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
 
server:
  port: 8083

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
  
clients:
  disponibilidad:
    url:${DISPONIBILIDAD_SERVICE_URL:lb://disponibilidad-service}
  hoteles:
    url: ${HOTELES:lb://hoteles-service}
