spring:
  application:
    name: facturas-service

  datasource:
    url: jdbc:mysql://localhost:3306/db_hoteleria_facturas
    username: root
    password:
    driver-class-name: com.mysql.jdbc.Driver

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false


server:
  port: 8090

services:
  huespedes:
    url: http://localhost:8085
  pagos:
    url: http://localhost:8089
  reservas:
    url: http://localhost:8086
  check_in:
    url: http://localhost:8087
  check_out:
    url: http://localhost:8088

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /swagger-ui.html