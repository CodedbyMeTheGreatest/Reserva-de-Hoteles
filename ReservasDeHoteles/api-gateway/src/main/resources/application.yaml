spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      mvc:
        discovery:
          locator:
            enabled: true
            lower-case-service-id: true
        routes:
          - id: hoteles
            uri: lb://hoteles-service
            predicates:
              - Path=/hoteles/**

          - id: disponibilidad
            uri: lb://disponibilidad-service
            predicates:
              - Path=/disponibilidades/**

          - id: habitaciones
            uri: lb://habitaciones-service
            predicates:
              - Path=/habitaciones/**

          - id: empleados
            uri: lb://empleados-service
            predicates:
              - Path=/empleados/**

          - id: huespedes
            uri: lb://huespedes-service
            predicates:
              - Path=/huespedes/**

          - id: reservas
            uri: lb://reservas-service
            predicates:
              - Path=/reservas/**

          - id: checkin
            uri: lb://check-in-service
            predicates:
              - Path=/check_in/**

          - id: checkout
            uri: lb://check-out-service
            predicates:
              - Path=/check_out/**

          - id: pagos
            uri: lb://pagos-service
            predicates:
              - Path=/pagos/**

          - id: facturas
            uri: lb://facturas-service
            predicates:
              - Path=/facturas/**

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true
  
management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: always
      
logging:
  level:
    "[org.springframework.cloud.gateway]": DEBUG
    "[cl.duoc.dsy1103.api_gateway]": DEBUG
server:
  port: 8080


