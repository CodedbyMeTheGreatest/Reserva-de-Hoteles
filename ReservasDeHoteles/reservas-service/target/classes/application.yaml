spring:
  application:
    name: reservas-service
  datasource:
    url: jdbc:mysql://localhost:3306/db_hoteleria_vm_check_ins
    username: root
    password:
    driver-class-name: com.mysql.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false

  flyway:
    baseline-on-migrate: true
    locations: classpath:db/migration

server:
  port: 8085

services:
  check_ins:
    url: http://localhost:8085
