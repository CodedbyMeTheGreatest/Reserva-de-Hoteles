spring:
  application:
    name: habitaciones-service
  profiles:
    active: dev
  jpa: 
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
 
server:
  port: 8083

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /swagger-ui.html

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://eureka-server:8761/eureka/}
  instance:
    prefer-ip-address: true

  
clients:
  disponibilidad:
    url:${DISPONIBILIDAD_SERVICE_URL:lb://disponibilidad-service}
  hoteles:
    url: ${HOTELES:lb://hoteles-service}
