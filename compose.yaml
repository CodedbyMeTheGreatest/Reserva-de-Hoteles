  facturas-service:
    build:
      context: ./facturas-service
      dockerfile: Dockerfile
    container_name: facturas-service
    restart: unless-stopped
    ports:
      - "8090:8090"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: 8090
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${FACTURAS_DB_NAME}
      DB_USER: ${MYSQL_USER}
      DB_PASS: ${MYSQL_PASSWORD}
      EUREKA_URL: http://eureka-server:8761/eureka/
      HUESPEDES_SERVICE_URL: http://huespedes-service:8085
      PAGOS_SERVICE_URL: http://pagos-service:8089
      RESERVAS_SERVICE_URL: http://reservas-service:8086
      CHECK_IN_SERVICE_URL: http://check-in-service:8087
      CHECK_OUT_SERVICE_URL: http://check-out-service:8088
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      huespedes-service:
        condition: service_started
      pagos-service:
        condition: service_started
      reservas-service:
        condition: service_started
      check-in-service:
        condition: service_started
      check-out-service:
        condition: service_started
    networks:
      - spring-hotel-net

  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: api-gateway
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      EUREKA_URL: http://eureka-server:8761/eureka/
    depends_on:
      eureka-server:
        condition: service_healthy
    networks:
      - spring-hotel-net

volumes:
  mysql_data:

networks:
  spring-hotel-net:
    driver: bridge
